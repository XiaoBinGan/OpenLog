name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The single most useful thing you can include is the
        **exact** error text — not a paraphrase. Copy it verbatim.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the exact error message, log lines, or a screenshot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the image tag.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.x"
  - type: input
    id: model
    attributes:
      label: Model / inference engine
      description: |
        If this involves AI features, name the engine (vLLM / SGLang / Ollama / other) and
        the model. Capability differences between engines are a common cause of
        "works for me".
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Deployment mode, reverse proxy, browser, relevant config.
