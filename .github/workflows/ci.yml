name: CI

on:
  push:
    branches: [node, main]
  pull_request:
    branches: [node, main]
  workflow_dispatch:

# 同一分支的新推送取消旧的进行中任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # 两个平台都跑完再汇总结果，避免一个平台失败掩盖另一个平台的结论
      fail-fast: false
      matrix:
        # Windows 必须进矩阵：Docker-over-SSH 桥、路径分隔符、执行策略等
        # 差异只在 Windows 暴露（历史上 local socket 建桥就因此漏到生产）
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30 依赖链要求 Node >= 22.22（@asamuzakjp/css-color 等），
          # 与本地开发版本保持一致
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # better-sqlite3 是原生模块；postinstall 守卫只会在预编译不可用时才编译源码
      - name: Install server dependencies
        run: npm ci --no-audit --no-fund

      - name: Install client dependencies
        run: npm ci --prefix client --no-audit --no-fund

      - name: Lint (server)
        run: npm run lint

      - name: Lint (client)
        run: npm run lint:client

      - name: Typecheck + build client
        run: npm run build

      # 测试覆盖：API 冒烟、数据库 CRUD、告警、Docker WS、安全回归
      # 服务端子进程由测试自行拉起，无需外部 SSH/Docker 依赖
      - name: Test
        run: npm test

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
