name: Deploy site

# 官网是纯静态（site/index.html + assets/），没有构建步骤。
#
# 为什么改成「推 gh-pages 分支」而不是 actions/deploy-pages：
#   2026-11-24 起 deploy-pages@v4 反复报 `Found 0 artifact(s)` —— artifact 明明上传成功
#   （能查到 id 与大小），但部署 API 查不到它（GitHub 强制 actions 跑在 Node 24 后的已知问题）。
#   peaceiris/actions-gh-pages 走的是普通 git push，不碰 artifact 部署 API，链路短且可预期。
#
# 单一事实来源仍然是 main 里的 site/：gh-pages 由 CI 生成（force_orphan，每次全新一份），
# 不要手工改 gh-pages 分支。

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish site/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 发布前自检：站点资源都是相对路径，缺文件只会在浏览器里 404，构建期发现不了。
      - name: Verify referenced assets exist
        run: |
          set -e
          cd site
          refs=$(grep -oE '(src|href)="[^"]+"' index.html \
                 | sed -E 's/^[a-zA-Z]+="//; s/"$//' \
                 | grep -vE '^(https?:|//|mailto:|#|data:)' \
                 | grep -E '^[A-Za-z0-9_./@-]+$' \
                 | sort -u || true)
          echo "本地相对引用:"
          echo "$refs" | sed 's/^/  /'
          missing=0
          for f in $refs; do
            [ -z "$f" ] && continue
            if [ ! -e "$f" ]; then
              echo "::error file=site/index.html::missing asset: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "全部存在"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'site: ${{ github.event.head_commit.message || github.sha }}'
