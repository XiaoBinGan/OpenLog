apiVersion: v1
kind: ConfigMap
metadata:
  name: reranker-gateway-conf
  namespace: inference
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 512; }
    stream {
      server { listen 18100; proxy_pass msrk-0.ms-reranker-headless.inference.svc.cluster.local:8004; }
      server { listen 18101; proxy_pass msrk-1.ms-reranker-headless.inference.svc.cluster.local:8004; }
      server { listen 18102; proxy_pass msrk-2.ms-reranker-headless.inference.svc.cluster.local:8004; }
      server { listen 18103; proxy_pass msrk-3.ms-reranker-headless.inference.svc.cluster.local:8004; }
      server { listen 18104; proxy_pass msrk-4.ms-reranker-headless.inference.svc.cluster.local:8004; }
      server { listen 18105; proxy_pass msrk-5.ms-reranker-headless.inference.svc.cluster.local:8004; }
      server { listen 38000; proxy_pass adapter-ops.inference.svc.cluster.local:8000; }
      server { listen 8000; proxy_pass yolo-curtain.inference.svc.cluster.local:8000; }
      server { listen 8012; proxy_pass curtain-detect.inference.svc.cluster.local:8000; }
      server { listen 8007; proxy_pass ms-reranker7.inference.svc.cluster.local:8004; }
      server { listen 3003; proxy_pass openlog-site.inference.svc.cluster.local:80; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reranker-gateway
  namespace: inference
  labels: { app: reranker-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: reranker-gateway }
  template:
    metadata:
      labels: { app: reranker-gateway }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: node1
      containers:
      - name: gateway
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: conf
        configMap: { name: reranker-gateway-conf }
