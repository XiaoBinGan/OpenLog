# OpenLog Kubernetes 接入 —— RBAC 与长期 token
#
# 本文件由两部分组成，边界很清楚：
#
#   【第一部分 · 默认安装】只读（openlog-readonly）
#     让 OpenLog 以「只读 ServiceAccount」直连 kube-apiserver，展示节点 / Pod / 工作负载 /
#     事件 / 日志 / 指标。这一部分只授予 get、list、watch，不授予 create / update / patch /
#     delete，也不授予 secrets 读取权限（即 OpenLog 拿不到任何密钥材料）。
#
#   【第二部分 · 可选】可写（openlog-operator）
#     **仅当需要扩缩容 / 重启工作负载 / 删 Pod 时才安装**（对应 OpenLog 的 K8s 写操作：
#     POST .../workloads/:ns/:kind/:name/scale|restart、DELETE .../pods/:ns/:name）。
#     它额外给出一个独立 ServiceAccount openlog-operator 与独立 token Secret
#     （openlog-operator-token），权限仍然是白名单式的：只有 apps 组的 deployments /
#     statefulsets 与其 /scale 子资源的读写，加 pods 的读 + 删。secrets、pods/exec、
#     pods/attach、节点写、RBAC 写**一律不给**（见下方注释里的逐条说明）。
#     两个 SA 的差异、切换方式与风险见 deploy/k8s/README.md「只读 vs 可写」一节。
#
# 使用：
#   kubectl apply -f deploy/k8s/rbac.yaml
#   bash deploy/k8s/make-kubeconfig.sh --server https://127.0.0.1:6443
#   # 需要写能力时换 operator 的 SA 与 Secret 再生成一份 kubeconfig：
#   bash deploy/k8s/make-kubeconfig.sh --server https://127.0.0.1:6443 \
#     --sa openlog-operator --secret openlog-operator-token
#
# 安全提示：
#   1. 本文件创建的 Secret 内是长期有效的 SA token，等同于「整个集群只读权限」的凭据。
#      不要把生成出来的 kubeconfig 提交进任何仓库，也不要贴进聊天工具。
#   2. 只读权限仍会暴露 Pod 日志（可能含业务敏感信息）、节点信息与事件内容，
#      请按最小授权原则决定是否在共享集群上启用。
#   3. 轮换方式见 deploy/k8s/README.md「token 轮换」一节。
#   4. openlog-operator-token 是**可写**凭据：泄露即等于把「改副本数 / 改 Pod 模板 /
#      删 Pod」的集群变更能力交给对方。只在确实需要写操作的集群上安装，
#      并且优先把它的权限从 ClusterRole 收窄成某个命名空间的 Role（做法见 README）。

---
apiVersion: v1
kind: Namespace
metadata:
  name: openlog
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: monitoring

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openlog-readonly
  namespace: openlog
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: monitoring
# 只读用途，不需要挂载任何业务 Secret，也不参与 token 自动挂载
automountServiceAccountToken: false

---
# 只读 ClusterRole：全部资源只允许 get / list / watch
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openlog-readonly
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: monitoring
rules:
  # 核心资源
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/status
      - pods
      - pods/log
      - pods/status
      - namespaces
      - services
      - endpoints
      - events
    verbs: ["get", "list", "watch"]

  # 工作负载：Deployment / StatefulSet / DaemonSet / ReplicaSet
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]

  # 批处理任务
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # 资源用量指标（需要集群装有 metrics-server；k3s 默认内置）
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openlog-readonly
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openlog-readonly
subjects:
  - kind: ServiceAccount
    name: openlog-readonly
    namespace: openlog

---
# k8s >= 1.24 不再为 ServiceAccount 自动签发长期 token Secret，
# 这里显式声明一个 kubernetes.io/service-account-token 类型的 Secret，
# 由 kube-controller-manager（k3s 内置）异步填充 token 与 ca.crt。
# 注意：apply 之后 token 不是立刻可读，通常 1~10 秒；k3s 上偶发更久，
#       请用 `kubectl -n openlog get secret openlog-readonly-token` 确认 token 字段非空后再生成
#       kubeconfig（make-kubeconfig.sh 会在 token 为空时直接报错退出）。
apiVersion: v1
kind: Secret
metadata:
  name: openlog-readonly-token
  namespace: openlog
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: monitoring
  annotations:
    kubernetes.io/service-account.name: openlog-readonly
type: kubernetes.io/service-account-token

# ===== 以下为可选：可写 operator（仅当需要扩缩容 / 重启 / 删 Pod 时才安装） =====
#
# 这一段与上面的只读部分**完全独立**：不安装它，集群里就不存在任何可写凭据；
# 安装它也不会改变 openlog-readonly 的任何权限（只读 ClusterRole 一个字符都没动）。
#
# 权限设计（白名单，逐条说明「为什么需要」）：
#   * apps/deployments、apps/statefulsets 的 get/list/watch/patch/update：
#     - scale  需要 patch/update 工作负载的 spec.replicas，并先 get 读当前副本数；
#     - restart 是给 Pod 模板加一条 kubectl.kubernetes.io/restartedAt 注解（patch），
#       由控制器滚动重建 Pod，所以必须有 patch 工作负载本体。
#   * apps/deployments/scale、apps/statefulsets/scale 的 get/patch/update：
#     /scale 子资源是独立资源，**不会**被工作负载本体的 verbs 覆盖，必须单独授权。
#   * ""/pods 的 get/list/watch/delete：
#     - 读写混合场景下页面仍需列 Pod；delete 对应「删除单个 Pod」按钮。
#       删 Pod 由控制器重建，等价于重启一个副本，不需要 create。
#
# 仍然明确不给（与只读部分同一套底线）：
#   * secrets / configmaps：拿不到任何密钥材料；
#   * pods/exec、pods/attach、pods/portforward：无法进入容器；
#   * nodes 的任何写动词（cordon / drain / 改标签）、nodes/status 写：不能动节点；
#   * rbac.authorization.k8s.io 的任何写动词（roles、rolebindings、clusterroles、
#     clusterrolebindings）：不能自我提权，也不能给别人授权；
#   * namespaces / services / ingresses / CRD 的写动词：一律不给；
#   * deletecollection：不允许一把删掉整批 Pod，只能按名字逐个删（给审计留痕）。
#
# 另外：该 SA 会**再绑定一次只读 ClusterRole**（见下方 openlog-operator-readonly 绑定），
# 这样「只贴一份 operator kubeconfig」时节点 / 事件 / 日志 / 指标等页面照旧可用，
# 不必在 OpenLog 里维护两份凭据。复用只读 ClusterRole 而不是复制一份规则，
# 是为了避免两份规则日后漂移。

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openlog-operator
  namespace: openlog
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: operator
# 与只读 SA 一致：token 只从显式声明的 Secret 取，不随 Pod 自动挂载
automountServiceAccountToken: false

---
# 可写 ClusterRole：仅覆盖「扩缩容 / 重启 / 删 Pod」这三个动作所需的最小集合
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openlog-operator
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: operator
rules:
  # 工作负载：读现状 + 改 spec.replicas + 打重启注解
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: ["get", "list", "watch", "patch", "update"]

  # /scale 子资源：独立授权，不会被上面一条覆盖
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - statefulsets/scale
    verbs: ["get", "patch", "update"]

  # Pod：读（页面需要）+ 按名删除（单副本重启）；不给 deletecollection
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openlog-operator
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openlog-operator
subjects:
  - kind: ServiceAccount
    name: openlog-operator
    namespace: openlog

---
# 让 operator SA 同时具备只读能力：复用上面的 openlog-readonly ClusterRole。
# 注意 roleRef 指向的是只读角色，subjects 是 operator SA —— 只读角色本身不变。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openlog-operator-readonly
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openlog-readonly
subjects:
  - kind: ServiceAccount
    name: openlog-operator
    namespace: openlog

---
# 可写 SA 的长期 token Secret：名字、类型、annotation 都与只读那份保持同一风格，
# 方便 make-kubeconfig.sh 直接复用（--sa openlog-operator --secret openlog-operator-token）。
# 同样由 kube-controller-manager 异步填充 token 与 ca.crt，apply 后 1~10 秒才可读。
apiVersion: v1
kind: Secret
metadata:
  name: openlog-operator-token
  namespace: openlog
  labels:
    app.kubernetes.io/name: openlog
    app.kubernetes.io/component: operator
  annotations:
    kubernetes.io/service-account.name: openlog-operator
type: kubernetes.io/service-account-token

---
# ─────────────────────────────────────────────────────────────────────────────
# AI Infra：在指定命名空间内「创建 / 删除」工作负载与服务
#
# 为什么必须单独加：operator 的 ClusterRole 只有 patch/update（改造已有工作负载），
# 但「起一个新服务」需要 create，「回滚掉新建对象」需要 delete。真机验证时干跑直接 403：
#   deployments.apps is forbidden: ... cannot create resource "deployments"
#
# 为什么用 Role（命名空间级）而不是扩大 ClusterRole：
#   create 无法用 resourceNames 收窄（对象还不存在），ClusterRole 一旦给 create
#   就等于能在 kube-system 里建东西。绑到 inference + infra-test 两个命名空间，
#   权限边界与护栏的命名空间白名单完全一致 —— 代码拒绝的和 RBAC 拒绝的是同一批。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openlog-infra-creator
  namespace: inference
rules:
  - apiGroups: ['apps']
    resources: ['deployments', 'statefulsets']
    verbs: ['create', 'delete']
  - apiGroups: ['']
    resources: ['services']
    verbs: ['create', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openlog-infra-creator
  namespace: inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openlog-infra-creator
subjects:
  - kind: ServiceAccount
    name: openlog-operator
    namespace: openlog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openlog-infra-creator
  namespace: infra-test
rules:
  - apiGroups: ['apps']
    resources: ['deployments', 'statefulsets']
    verbs: ['create', 'delete']
  - apiGroups: ['']
    resources: ['services']
    verbs: ['create', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openlog-infra-creator
  namespace: infra-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openlog-infra-creator
subjects:
  - kind: ServiceAccount
    name: openlog-operator
    namespace: openlog
