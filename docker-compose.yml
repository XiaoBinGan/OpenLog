# ─── OpenLog Docker Compose ─────────────────────────────────────────────

services:
  openlog:
    build: .
    container_name: openlog
    ports:
      - "3001:3001"
    volumes:
      - openlog_data:/app/data
      - ./logs:/app/logs:ro
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - MODEL=${MODEL:-gpt-4o-mini}
    restart: unless-stopped

volumes:
  openlog_data: