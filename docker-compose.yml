# ─── OpenLog Docker Compose（单机/内网快速起一套）──────────────────────
#
# 适合：新机器从零起一套（应用 + PostgreSQL 一起）。
# 不适合：已有的生产实例 —— 生产更新用 scripts/deploy.sh（会备份+健康检查+失败回滚）。
#
# 用法：
#   cp deploy.env.example .env      # 填 OPENLOG_TOKEN / POSTGRES_PASSWORD
#   docker compose up -d --build
#
# 端口说明：容器内应用监听 3011；对外暴露 3011。
# 若用 docker-over-SSH 类功能（容器管理别的宿主机 Docker），把 openlog 的
# network_mode 改成 host 并把 PORT 改 3001，见 deploy.env.example。

services:
  openlog:
    build: .
    container_name: openlog
    ports:
      - "3011:3011"
    volumes:
      - openlog_data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3011
      - HOST=0.0.0.0
      # 生产模式强制鉴权，必须提供 token
      - OPENLOG_TOKEN=${OPENLOG_TOKEN:?必须设置 OPENLOG_TOKEN（生产模式强制鉴权）}
      # 凭据加密密钥。设置后不要再取消（单向迁移）
      - OPENLOG_SECRET_KEY=${OPENLOG_SECRET_KEY:-}
      - OPENLOG_ALLOWED_ORIGINS=${OPENLOG_ALLOWED_ORIGINS:-}
      # 容器内执行命令面板（只读白名单）
      - OPENLOG_ENABLE_CONTAINER_EXEC=${OPENLOG_ENABLE_CONTAINER_EXEC:-}
      # REST 远程命令执行（外部脚本用，默认关闭）
      - OPENLOG_ENABLE_REMOTE_EXEC=${OPENLOG_ENABLE_REMOTE_EXEC:-}
      # 数据库：默认连下面的 postgres 服务
      - OPENLOG_DB_TYPE=postgres
      - OPENLOG_DATABASE_URL=postgres://openlog:${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}@postgres:5432/openlog
      - OPENLOG_PG_POOL_MAX=${OPENLOG_PG_POOL_MAX:-10}
      - LOG_PATH=${LOG_PATH:-/app/logs}
      # 首次启动时作为默认值写入（数据库已有配置则以数据库为准）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - MODEL=${MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3011)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  postgres:
    image: postgres:16-alpine
    container_name: openlog-pg
    environment:
      - POSTGRES_USER=openlog
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      - POSTGRES_DB=openlog
    volumes:
      - openlog_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlog -d openlog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openlog_data:
  openlog_pgdata:
